openapi: 3.1.0
info:
  title: Monutchee Provisioning Station API
  version: 1.1.0
  description: >-
    Local hardware provisioning API. Cloud orchestration is outside this
    service. A bearer token is required except for direct requests whose client
    and Host addresses are both IP loopback addresses (127.0.0.0/8 or ::1).
servers:
  - url: http://{station}:8042/api/v1
    variables:
      station:
        default: 127.0.0.1
        description: Provisioning Station hostname or IPv4 address
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Check whether the local agent is alive
      security: []
      responses:
        "200":
          description: Healthy agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /capabilities:
    get:
      summary: Discover executors, artifact limits, and local tool availability
      responses:
        "200":
          description: Agent capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /artifacts:
    get:
      summary: List imported artifacts
      responses:
        "200":
          description: Imported artifacts, newest first
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoredArtifact"
    post:
      summary: Validate and import one Station artifact
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [artifact]
              properties:
                artifact:
                  type: string
                  format: binary
      responses:
        "201":
          description: Verified content-addressed artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredArtifact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: Artifact exceeds a configured limit
  /artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      summary: Read one imported artifact record
      responses:
        "200":
          description: Artifact record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredArtifact"
        "404":
          $ref: "#/components/responses/NotFound"
  /xilinx/targets:
    get:
      summary: Discover ZynqMP devices attached to a Xilinx hardware server
      parameters:
        - name: hwServerUrl
          in: query
          required: true
          schema:
            type: string
          example: tcp:127.0.0.1:3121
      responses:
        "200":
          description: Discoverable PSU targets with cable and device identity
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items:
                      $ref: "#/components/schemas/XilinxTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
  /serial/ports:
    get:
      summary: Discover local operating-system serial ports
      description: >-
        Returns locally enumerated Linux tty and Windows COM ports. A unique
        FT2232H channel B identity is used for automatic JTAG association;
        every other listed port remains available for explicit manual use.
      responses:
        "200":
          description: Stable serial-console ports and identity warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialDiscovery"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /serial/sessions:
    post:
      summary: Reserve and configure a live serial-console attachment
      description: >-
        Opens or shares the selected port at 8N1. Many observers may attach,
        but only one controller may hold the write lease. The returned attach
        token expires after 30 seconds and is used exactly once as the first
        WebSocket text message; it is never placed in a URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SerialSessionRequest"
      responses:
        "201":
          description: Pending serial session
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Controller lease is held or the port is open at another baud rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /serial/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SerialSessionId"
    delete:
      summary: Release a pending or active serial session
      responses:
        "204":
          description: Session released
        "404":
          $ref: "#/components/responses/NotFound"
  /serial/sessions/{sessionId}/stream:
    parameters:
      - $ref: "#/components/parameters/SerialSessionId"
    get:
      summary: Upgrade to the binary serial WebSocket protocol
      security: []
      description: >-
        Upgrade this same-origin URL to WebSocket. Within five seconds, send
        one text JSON message `{"type":"attach","token":"..."}` using the
        one-time token from POST /serial/sessions. The server replies with one
        `ready` text message. Subsequent server frames are raw RX bytes in
        binary messages. Controller clients send raw TX bytes in binary
        messages; observers must not send data. Individual client messages are
        limited to 64 KiB.
      responses:
        "101":
          description: WebSocket serial stream
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs:
    get:
      summary: List provisioning jobs
      responses:
        "200":
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
    post:
      summary: Validate and queue a provisioning job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "201":
          description: Queued job
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
  /jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Read one provisioning job
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Cancel a queued or running job
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{jobId}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Return only events with a sequence greater than this value.
    get:
      summary: Read or stream ordered audit events
      description: "Send `Accept: text/event-stream` for an SSE stream; otherwise JSON is returned."
      responses:
        "200":
          description: Event history or stream
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{jobId}/serial-transcript:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Download the retained RX-only serial transcript for a job
      responses:
        "200":
          description: Raw serial bytes retained during the job
          headers:
            X-MNC-Serial-Capture-State:
              schema:
                type: string
                enum: [capturing, complete, truncated, failed]
            X-MNC-Serial-Truncated:
              schema:
                type: boolean
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    SerialSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Input failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, version, apiVersion, time]
      properties:
        status:
          const: ok
        version:
          type: string
        apiVersion:
          const: v1
        time:
          type: string
          format: date-time
    Capabilities:
      type: object
      required: [apiVersion, version, artifact, executors, operations, tftpListen, network, xsdb, serial, authRequired]
      properties:
        apiVersion:
          const: v1
        version:
          type: string
        artifact:
          type: object
          required: [schema, formatVersions, maxCompressedBytes, maxUncompressedBytes]
          properties:
            schema:
              const: mnc-station-artifact
            formatVersions:
              type: array
              items:
                type: integer
            maxCompressedBytes:
              type: integer
            maxUncompressedBytes:
              type: integer
        executors:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
        tftpListen:
          type: string
        network:
          type: object
          required: [ipv4Addresses, ipv4Interfaces]
          properties:
            preferredTftpServerIp:
              type: string
              format: ipv4
              description: Best detected Station address for target TFTP requests.
            ipv4Addresses:
              type: array
              description: Usable non-loopback IPv4 addresses detected on the Station.
              items:
                type: string
                format: ipv4
            ipv4Interfaces:
              type: array
              description: Usable interfaces in operating-system order; the first is the default.
              items:
                type: object
                required: [name, address]
                properties:
                  name:
                    type: string
                  address:
                    type: string
                    format: ipv4
        xsdb:
          type: object
          required: [available]
          properties:
            available:
              type: boolean
            path:
              type: string
            error:
              type: string
        serial:
          type: object
          required: [available, defaultBaudRate, maxJobTranscriptBytes, replayBytes, ftdiVendorId, ftdiProductId, uartChannel]
          properties:
            available:
              type: boolean
            defaultBaudRate:
              type: integer
              minimum: 300
              maximum: 4000000
            maxJobTranscriptBytes:
              type: integer
              minimum: 1
            replayBytes:
              type: integer
              minimum: 0
            ftdiVendorId:
              const: "0403"
            ftdiProductId:
              const: "6010"
            uartChannel:
              const: B
        authRequired:
          type: boolean
          description: Whether this request origin must provide the configured bearer token.
    XilinxTarget:
      type: object
      required: [id, name, serialAssociation]
      properties:
        id:
          type: string
          pattern: "^[1-9][0-9]*$"
        name:
          type: string
        deviceIndex:
          type: string
        deviceName:
          type: string
        cableName:
          type: string
        cableSerial:
          type: string
        serialAssociation:
          type: string
          enum: [matched, not_found, ambiguous]
          description: Result of matching cableSerial to a local FTDI channel B EEPROM serial.
        serialPort:
          $ref: "#/components/schemas/SerialPort"
    SerialPort:
      type: object
      required: [id, name, busy, hasController]
      properties:
        id:
          type: string
          description: >-
            Opaque port ID. Automatically matchable FTDI ports retain a stable
            hardware-derived ID; manual-only ports use their current OS name.
        name:
          type: string
          description: Current operating-system name such as /dev/ttyUSB1 or COM7.
        vendorId:
          type: string
          pattern: "^[0-9A-Fa-f]{4}$"
          description: USB vendor ID when reported by the operating system.
        productId:
          type: string
          pattern: "^[0-9A-Fa-f]{4}$"
          description: USB product ID when reported by the operating system.
        usbSerial:
          type: string
          minLength: 1
          description: USB serial when reported by the operating system.
        channel:
          type: string
          enum: [A, B]
          description: FT2232H interface channel when it can be determined.
        busy:
          type: boolean
          description: The backend currently has this physical port open.
        hasController:
          type: boolean
          description: A live session currently holds the single write lease.
        activeBaudRate:
          type: integer
          minimum: 300
          maximum: 4000000
          description: Present while the backend has the physical port open.
    SerialWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [serial_missing, serial_duplicate]
        message:
          type: string
        usbSerial:
          type: string
    SerialDiscovery:
      type: object
      required: [ports, warnings]
      properties:
        ports:
          type: array
          items:
            $ref: "#/components/schemas/SerialPort"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/SerialWarning"
    SerialSessionRequest:
      type: object
      additionalProperties: false
      required: [portId, access]
      properties:
        portId:
          type: string
        baudRate:
          type: integer
          minimum: 300
          maximum: 4000000
          description: Uses the Station default when omitted.
        access:
          type: string
          enum: [observer, controller]
    SerialSession:
      type: object
      required: [id, port, baudRate, access, attachToken, expiresUtc, websocketPath]
      properties:
        id:
          type: string
        port:
          $ref: "#/components/schemas/SerialPort"
        baudRate:
          type: integer
        access:
          type: string
          enum: [observer, controller]
        attachToken:
          type: string
          writeOnly: true
        expiresUtc:
          type: string
          format: date-time
        websocketPath:
          type: string
    StoredArtifact:
      type: object
      required: [id, importedUtc, compressedBytes, uncompressedBytes, hasSignature, manifest]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        importedUtc:
          type: string
          format: date-time
        compressedBytes:
          type: integer
          minimum: 1
        uncompressedBytes:
          type: integer
          minimum: 1
        hasSignature:
          type: boolean
        manifest:
          type: object
          description: Validated mnc-station-artifact v2 manifest.
    JobRequest:
      type: object
      additionalProperties: false
      required: [artifactId, hwServerUrl, tftpServerIp]
      properties:
        artifactId:
          type: string
          pattern: "^[0-9a-f]{64}$"
        hwServerUrl:
          type: string
          examples: ["tcp:127.0.0.1:3121"]
        tftpServerIp:
          type: string
          format: ipv4
        boardIp:
          type: string
          format: ipv4
        targetId:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Session-local XSDB PSU target ID retained for compatibility and diagnostics.
        targetCableSerial:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable JTAG cable serial selected by the target-discovery endpoint.
        targetDeviceIndex:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
          description: JTAG device index on the selected cable; requires targetCableSerial.
        serialConsole:
          type: object
          additionalProperties: false
          required: [portId]
          properties:
            portId:
              type: string
              description: ID returned by GET /serial/ports.
            baudRate:
              type: integer
              minimum: 300
              maximum: 4000000
              description: Uses the Station default when omitted.
            selection:
              type: string
              enum: [matched, manual]
              default: matched
              description: >-
                matched requires the Xilinx runner to verify the FTDI identity
                against targetCableSerial. manual explicitly selects any
                currently enumerated tty/COM port without asserting a pairing.
    Job:
      type: object
      required: [id, request, state, createdUtc, eventCount]
      properties:
        id:
          type: string
        request:
          $ref: "#/components/schemas/JobRequest"
        state:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        createdUtc:
          type: string
          format: date-time
        startedUtc:
          type: string
          format: date-time
        finishedUtc:
          type: string
          format: date-time
        error:
          type: string
        eventCount:
          type: integer
          minimum: 0
        serialCapture:
          $ref: "#/components/schemas/SerialCapture"
    SerialCapture:
      type: object
      required: [state, receivedBytes, retainedBytes, truncated, startedUtc]
      properties:
        state:
          type: string
          enum: [capturing, complete, truncated, failed]
        receivedBytes:
          type: integer
          minimum: 0
        retainedBytes:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        startedUtc:
          type: string
          format: date-time
        finishedUtc:
          type: string
          format: date-time
    Event:
      type: object
      required: [sequence, time, level, message]
      properties:
        sequence:
          type: integer
          minimum: 1
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [info, warning, error]
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
