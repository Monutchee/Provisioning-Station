openapi: 3.1.0
info:
  title: Monutchee Provisioning Station API
  version: 1.1.0
  description: >-
    Local hardware provisioning API. Cloud orchestration is outside this
    service. A bearer token is required except for direct requests whose client
    and Host addresses are both IP loopback addresses (127.0.0.0/8 or ::1).
servers:
  - url: http://{station}:8042/api/v1
    variables:
      station:
        default: 127.0.0.1
        description: Provisioning Station hostname or IPv4 address
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Check whether the local agent is alive
      security: []
      responses:
        "200":
          description: Healthy agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /capabilities:
    get:
      summary: Discover executors, artifact limits, and local tool availability
      responses:
        "200":
          description: Agent capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /storage:
    get:
      summary: Inspect active state storage and recovery copies
      description: Recovery locations are reported separately and never included in the active state budget or removed automatically.
      responses:
        "200":
          description: Current logical file bytes, reservations and retention counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/StorageFailure"
  /storage/cleanup:
    post:
      summary: Preview or apply active state retention
      description: Keep the latest 30 completed jobs and all active jobs. Unknown files and recovery copies are never deleted. Firmware for completed jobs can expire under storage pressure; accepted request IDs remain durable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                apply:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Selected records and actual current storage status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StorageStatus"
                  - type: object
                    required: [apply, jobIds, artifactIds, reclaimableBytes]
                    properties:
                      apply:
                        type: boolean
                      jobIds:
                        type: array
                        items:
                          type: string
                      artifactIds:
                        type: array
                        items:
                          type: string
                      reclaimableBytes:
                        type: integer
                        format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/StorageFailure"
  /artifacts:
    get:
      summary: List imported artifacts
      responses:
        "200":
          description: Imported artifacts, newest first
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoredArtifact"
    post:
      summary: Validate and import one Station artifact
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [artifact]
              properties:
                artifact:
                  type: string
                  format: binary
      responses:
        "507":
          $ref: "#/components/responses/StorageFull"
        "201":
          description: Verified content-addressed artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredArtifact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: Artifact exceeds a configured limit
  /artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      summary: Read one imported artifact record
      responses:
        "200":
          description: Artifact record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredArtifact"
        "404":
          $ref: "#/components/responses/NotFound"
  /xilinx/targets:
    get:
      summary: Discover ZynqMP devices attached to a Xilinx hardware server
      parameters:
        - name: hwServerUrl
          in: query
          required: true
          schema:
            type: string
          example: tcp:127.0.0.1:3121
      responses:
        "200":
          description: Discoverable PSU targets with cable and device identity
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items:
                      $ref: "#/components/schemas/XilinxTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
  /serial/ports:
    get:
      summary: Discover local operating-system serial ports
      description: >-
        Returns locally enumerated Linux tty and Windows COM ports. A unique
        FT2232H channel B identity is used for automatic JTAG association;
        every other listed port remains available for explicit manual use.
      responses:
        "200":
          description: Stable serial-console ports and identity warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialDiscovery"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /serial/sessions:
    post:
      summary: Reserve and configure a live serial-console attachment
      description: >-
        Opens or shares the selected port at 8N1. Many observers may attach,
        but only one controller may hold the write lease. The returned attach
        token expires after 30 seconds and is used exactly once as the first
        WebSocket text message; it is never placed in a URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SerialSessionRequest"
      responses:
        "201":
          description: Pending serial session
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Controller lease is held or the port is open at another baud rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /serial/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SerialSessionId"
    delete:
      summary: Release a pending or active serial session
      responses:
        "204":
          description: Session released
        "404":
          $ref: "#/components/responses/NotFound"
  /serial/sessions/{sessionId}/stream:
    parameters:
      - $ref: "#/components/parameters/SerialSessionId"
    get:
      summary: Upgrade to the binary serial WebSocket protocol
      security: []
      description: >-
        Upgrade this same-origin URL to WebSocket. Within five seconds, send
        one text JSON message `{"type":"attach","token":"..."}` using the
        one-time token from POST /serial/sessions. The server replies with one
        `ready` text message. Subsequent server frames are raw RX bytes in
        binary messages. Controller clients send raw TX bytes in binary
        messages; observers must not send data. Individual client messages are
        limited to 64 KiB.
      responses:
        "101":
          description: WebSocket serial stream
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs:
    get:
      summary: List provisioning jobs
      responses:
        "200":
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
    post:
      summary: Validate and queue a provisioning job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "410":
          $ref: "#/components/responses/SubmissionExpired"
        "507":
          $ref: "#/components/responses/StorageFull"
        "200":
          description: Replayed original job for an identical accepted request ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          description: Request ID already accepted with different parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "201":
          description: Queued job
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
  /submissions/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{32}$"
    get:
      summary: Reconcile an accepted job submission without resubmitting
      description: A missing record does not prove another in-flight submission has finished. Retry only with the same request ID and payload.
      responses:
        "410":
          $ref: "#/components/responses/SubmissionExpired"
        "200":
          description: Original accepted job, including its current state
          content:
            application/json:
              schema:
                type: object
                required: [requestId, jobId, job]
                properties:
                  requestId:
                    type: string
                  jobId:
                    type: string
                  job:
                    $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Read one provisioning job
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      summary: Cancel a queued or running job
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{jobId}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: limit
        in: query
        description: Maximum events in a JSON page; omitted preserves legacy unlimited history. Does not apply to SSE. Continue with the final returned sequence as after.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Return only events with a sequence greater than this value.
    get:
      summary: Read or stream ordered audit events
      description: "Send `Accept: text/event-stream` for an SSE stream; otherwise JSON is returned."
      responses:
        "200":
          description: Event history or stream
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{jobId}/serial-transcript:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      summary: Download the retained RX-only serial transcript for a job
      responses:
        "200":
          description: Raw serial bytes retained during the job
          headers:
            X-MNC-Serial-Capture-State:
              schema:
                type: string
                enum: [capturing, complete, truncated, failed]
            X-MNC-Serial-Truncated:
              schema:
                type: boolean
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    SerialSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
  responses:
    SubmissionExpired:
      description: Previously accepted request history expired. This request ID will never execute again. A different payload with the same ID returns 409.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StorageFull:
      description: Protected state and reservations prevent growth within the 10 GiB active state budget.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StorageFailure:
      description: State inspection or safe cleanup failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Input failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    StorageStatus:
      type: object
      required: [limitBytes, usedBytes, reservedBytes, availableBytes, unknownBytes, overBudget, completedJobLimit, completedJobs, activeJobs, recoveryLocations]
      properties:
        limitBytes:
          type: integer
          format: int64
        usedBytes:
          type: integer
          format: int64
        reservedBytes:
          type: integer
          format: int64
        availableBytes:
          type: integer
          format: int64
        unknownBytes:
          type: integer
          format: int64
        overBudget:
          type: boolean
        completedJobLimit:
          const: 30
        completedJobs:
          type: integer
        activeJobs:
          type: integer
        recoveryLocations:
          type: array
          items:
            type: object
            required: [path, bytes]
            properties:
              path:
                type: string
              bytes:
                type: integer
                format: int64
              inaccessible:
                type: boolean

    Health:
      type: object
      required: [status, version, apiVersion, time]
      properties:
        status:
          const: ok
        version:
          type: string
        apiVersion:
          const: v1
        time:
          type: string
          format: date-time
    Capabilities:
      type: object
      required: [apiVersion, version, artifact, executors, operations, tftpListen, network, xsdb, serial, authRequired]
      properties:
        apiVersion:
          const: v1
        version:
          type: string
        artifact:
          type: object
          required: [schema, formatVersions, maxCompressedBytes, maxUncompressedBytes]
          properties:
            schema:
              const: mnc-station-artifact
            formatVersions:
              type: array
              items:
                type: integer
            maxCompressedBytes:
              type: integer
            maxUncompressedBytes:
              type: integer
        deploymentTasks:
          $ref: "#/components/schemas/DeploymentTaskCapabilities"
        executors:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
        tftpListen:
          type: string
        network:
          type: object
          required: [ipv4Addresses, ipv4Interfaces]
          properties:
            preferredTftpServerIp:
              type: string
              format: ipv4
              description: Best detected Station address for target TFTP requests.
            ipv4Addresses:
              type: array
              description: Usable non-loopback IPv4 addresses detected on the Station.
              items:
                type: string
                format: ipv4
            ipv4Interfaces:
              type: array
              description: Usable interfaces in operating-system order; the first is the default.
              items:
                type: object
                required: [name, address]
                properties:
                  name:
                    type: string
                  address:
                    type: string
                    format: ipv4
        xsdb:
          type: object
          required: [available]
          properties:
            available:
              type: boolean
            path:
              type: string
            error:
              type: string
        serial:
          type: object
          required: [available, defaultBaudRate, maxJobTranscriptBytes, replayBytes, ftdiVendorId, ftdiProductId, uartChannel]
          properties:
            available:
              type: boolean
            defaultBaudRate:
              type: integer
              minimum: 300
              maximum: 4000000
            maxJobTranscriptBytes:
              type: integer
              minimum: 1
            replayBytes:
              type: integer
              minimum: 0
            ftdiVendorId:
              const: "0403"
            ftdiProductId:
              const: "6010"
            uartChannel:
              const: B
        authRequired:
          type: boolean
          description: Whether this request origin must provide the configured bearer token.
    XilinxTarget:
      type: object
      required: [id, name, serialAssociation]
      properties:
        id:
          type: string
          pattern: "^[1-9][0-9]*$"
        name:
          type: string
        deviceIndex:
          type: string
        deviceName:
          type: string
        cableName:
          type: string
        cableSerial:
          type: string
        serialAssociation:
          type: string
          enum: [matched, not_found, ambiguous]
          description: Result of matching cableSerial to a local FTDI channel B EEPROM serial.
        serialPort:
          $ref: "#/components/schemas/SerialPort"
    SerialPort:
      type: object
      required: [id, name, busy, hasController]
      properties:
        id:
          type: string
          description: >-
            Opaque port ID. Automatically matchable FTDI ports retain a stable
            hardware-derived ID; manual-only ports use their current OS name.
        name:
          type: string
          description: Current operating-system name such as /dev/ttyUSB1 or COM7.
        vendorId:
          type: string
          pattern: "^[0-9A-Fa-f]{4}$"
          description: USB vendor ID when reported by the operating system.
        productId:
          type: string
          pattern: "^[0-9A-Fa-f]{4}$"
          description: USB product ID when reported by the operating system.
        usbSerial:
          type: string
          minLength: 1
          description: USB serial when reported by the operating system.
        channel:
          type: string
          enum: [A, B]
          description: FT2232H interface channel when it can be determined.
        busy:
          type: boolean
          description: The backend currently has this physical port open.
        hasController:
          type: boolean
          description: A live session currently holds the single write lease.
        activeBaudRate:
          type: integer
          minimum: 300
          maximum: 4000000
          description: Present while the backend has the physical port open.
    SerialWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [serial_missing, serial_duplicate]
        message:
          type: string
        usbSerial:
          type: string
    SerialDiscovery:
      type: object
      required: [ports, warnings]
      properties:
        ports:
          type: array
          items:
            $ref: "#/components/schemas/SerialPort"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/SerialWarning"
    SerialSessionRequest:
      type: object
      additionalProperties: false
      required: [portId, access]
      properties:
        portId:
          type: string
        baudRate:
          type: integer
          minimum: 300
          maximum: 4000000
          description: Uses the Station default when omitted.
        access:
          type: string
          enum: [observer, controller]
    SerialSession:
      type: object
      required: [id, port, baudRate, access, attachToken, expiresUtc, websocketPath]
      properties:
        id:
          type: string
        port:
          $ref: "#/components/schemas/SerialPort"
        baudRate:
          type: integer
        access:
          type: string
          enum: [observer, controller]
        attachToken:
          type: string
          writeOnly: true
        expiresUtc:
          type: string
          format: date-time
        websocketPath:
          type: string
    StoredArtifact:
      type: object
      required: [id, importedUtc, compressedBytes, uncompressedBytes, hasSignature, manifest]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        importedUtc:
          type: string
          format: date-time
        compressedBytes:
          type: integer
          minimum: 1
        uncompressedBytes:
          type: integer
          minimum: 1
        hasSignature:
          type: boolean
        manifest:
          type: object
          description: Validated mnc-station-artifact v2 manifest.
    DeploymentTaskInvocation:
      type: object
      additionalProperties: false
      required: [id, task, parameters]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"
        task:
          type: string
          description: Trusted registered task identifier advertised by this Station.
        parameters:
          type: object
          description: Flat parameters validated against the task descriptor. Integers must be within the JSON safe integer range.
          additionalProperties:
            type: [string, boolean, number]
    DeploymentTasks:
      type: object
      additionalProperties: false
      required: [version]
      description: At most 64 invocation IDs, unique across all four ordered phases. No executable paths or shell commands.
      properties:
        version:
          const: 1
        beforeBoot:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentTaskInvocation"
        onSuccess:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentTaskInvocation"
        onFailure:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentTaskInvocation"
        onCancel:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentTaskInvocation"
    DeploymentTaskCapabilities:
      type: object
      required: [versions, phases, tasks]
      properties:
        versions:
          type: array
          items:
            const: 1
        phases:
          type: array
          items:
            enum: [beforeBoot, onSuccess, onFailure, onCancel]
        tasks:
          type: array
          items:
            type: object
            required: [id, parameters, timeoutSeconds]
            properties:
              id:
                type: string
              timeoutSeconds:
                type: number
                exclusiveMinimum: 0
                maximum: 3600
              parameters:
                type: array
                items:
                  type: object
                  required: [name, type, required]
                  properties:
                    name:
                      type: string
                    type:
                      enum: [string, boolean, integer, number]
                    required:
                      type: boolean
                    enum:
                      type: array
                      items:
                        type: [string, boolean, number]
    DeploymentTaskResult:
      type: object
      required: [id, task, phase, state, startedUtc]
      properties:
        id:
          type: string
        task:
          type: string
        phase:
          enum: [beforeBoot, onSuccess, onFailure, onCancel]
        state:
          enum: [running, succeeded, failed, canceled, interrupted]
        startedUtc:
          type: string
          format: date-time
        finishedUtc:
          type: string
          format: date-time
        error:
          type: string
    JobRequest:
      type: object
      additionalProperties: false
      required: [artifactId, hwServerUrl, tftpServerIp]
      properties:
        requestId:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Optional accepted-job idempotency key. Reuse only with the same payload; accepted IDs never execute again, including after restart. Validation failures are not recorded.
        deploymentTasks:
          $ref: "#/components/schemas/DeploymentTasks"
        artifactId:
          type: string
          pattern: "^[0-9a-f]{64}$"
        hwServerUrl:
          type: string
          examples: ["tcp:127.0.0.1:3121"]
        tftpServerIp:
          type: string
          format: ipv4
        boardIp:
          type: string
          format: ipv4
        targetId:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Session-local XSDB PSU target ID retained for compatibility and diagnostics.
        targetCableSerial:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable JTAG cable serial selected by the target-discovery endpoint.
        targetDeviceIndex:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
          description: JTAG device index on the selected cable; requires targetCableSerial.
        serialConsole:
          type: object
          additionalProperties: false
          required: [portId]
          properties:
            portId:
              type: string
              description: ID returned by GET /serial/ports.
            baudRate:
              type: integer
              minimum: 300
              maximum: 4000000
              description: Uses the Station default when omitted.
            selection:
              type: string
              enum: [matched, manual]
              default: matched
              description: >-
                matched requires the Xilinx runner to verify the FTDI identity
                against targetCableSerial. manual explicitly selects any
                currently enumerated tty/COM port without asserting a pairing.
    Job:
      type: object
      required: [id, request, state, createdUtc, eventCount, artifactAvailable]
      properties:
        artifactAvailable:
          type: boolean
          description: Whether the referenced firmware remains in local storage. Completed job firmware may expire under storage pressure.
        eventsTruncated:
          type: boolean
          description: Event output exceeded retention limits; terminal job metadata remains available.

        deploymentError:
          type: string
          description: Primary deployment error retained even if outcome tasks are canceled.
        deploymentOutcome:
          enum: [succeeded, failed, canceled]
          description: Primary deployment outcome before the selected outcome tasks.
        taskErrors:
          type: array
          items:
            type: string
        taskResults:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentTaskResult"
        id:
          type: string
        request:
          $ref: "#/components/schemas/JobRequest"
        state:
          type: string
