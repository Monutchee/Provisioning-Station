name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate release tag
        run: '[[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Build archives and Debian packages
        run: ./packaging/build-release.sh "${GITHUB_REF_NAME}" release
      - uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: release/*

  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH"
          }
      - name: Build Windows binary
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          New-Item -ItemType Directory -Force release\input | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$version -X main.commit=$env:GITHUB_SHA -X main.buildDate=$date" -o release\input\mnc-station.exe .\cmd\mnc-station
      - name: Build MSI with WiX
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          dotnet tool install --global wix --version 6.0.0
          wix build -arch x64 -d Version=$version -d SourceDir="$pwd\release\input" -o "release\mnc-station_${version}_windows_amd64.msi" packaging\windows\Product.wxs
      - uses: actions/upload-artifact@v7
        with:
          name: release-msi
          path: release/*.msi

  publish:
    needs: [archives, windows-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes
