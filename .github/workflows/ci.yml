name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/mps
      - run: go build -trimpath ./cmd/mpsd
      - name: Verify Windows MSI packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\input | Out-Null
          Copy-Item -Path mps.exe, mpsd.exe, LICENSE, THIRD_PARTY_NOTICES.md -Destination release\input\
          dotnet tool install --global wix --version 6.0.0
          wix build -arch x64 -d Version=0.0.0 -d SourceDir="$pwd\release\input" -o release\mps-ci.msi packaging\windows\Product.wxs

  quality:
    name: Format, race, and cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Race detector
        run: go test -race ./...
      - name: Compile Linux arm64
        run: |
          go build -trimpath -o /tmp/mps-linux-arm64 ./cmd/mps
          go build -trimpath -o /tmp/mpsd-linux-arm64 ./cmd/mpsd
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
      - name: Compile Windows amd64
        run: |
          go build -trimpath -o /tmp/mps-windows-amd64.exe ./cmd/mps
          go build -trimpath -o /tmp/mpsd-windows-amd64.exe ./cmd/mpsd
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
      - name: Verify legacy release packaging and cleanup
        env:
          MPS_BUILD_ID: "012345"
        run: |
          bash -n packaging/bash-completion/mps packaging/bash-completion/mpsd
          bash packaging/test-git-version.sh
          python3 -B packaging/migration/test_migrate.py
          mkdir -p build/release-ci
          touch build/release-ci/stale-output
          ./packaging/build-release.sh 0.0.0 build/release-ci
          test ! -e build/release-ci/stale-output
          test -f build/release-ci/mps_0.0.0+012345_linux_amd64.tar.gz
          test -f build/release-ci/mps_0.0.0+012345_linux_arm64.tar.gz
          test -f build/release-ci/mps_0.0.0+012345_windows_amd64.zip
          test -f build/release-ci/mps_0.0.0+012345_amd64.deb
          dpkg-deb -x build/release-ci/mps_0.0.0+012345_amd64.deb build/release-ci/deb-root
          grep -Fq 'ExecStart=/usr/bin/mpsd serve' build/release-ci/deb-root/lib/systemd/system/mps.service
          test -f build/release-ci/deb-root/usr/share/bash-completion/completions/mps
          bash -n build/release-ci/deb-root/usr/share/bash-completion/completions/mps
          test "$(dpkg-deb -f build/release-ci/mps_0.0.0+012345_amd64.deb Version)" = '0.0.0+012345'
          source packaging/git-version.sh
          display="$(station_display_version "$PWD")"
          build/release-ci/deb-root/usr/bin/mps version | grep -F "mps ${display} (commit "
          build/release-ci/deb-root/usr/bin/mpsd version | grep -F "mpsd ${display} (commit "
      - name: Build and verify automatic packages
        run: |
          ./packaging/build-release.sh build/development-ci
          commit="$(git rev-parse HEAD)"
          source packaging/git-version.sh
          version="$(station_git_version "$PWD")"
          display="$(station_display_version "$PWD")"
          for suffix in linux_amd64.tar.gz linux_arm64.tar.gz windows_amd64.zip amd64.deb arm64.deb; do
            test -f "build/development-ci/mps_${version}_${suffix}"
          done
          test "$(dpkg-deb -f "build/development-ci/mps_${version}_amd64.deb" Version)" = "${version/-dev/~dev}"
          dpkg-deb -x "build/development-ci/mps_${version}_amd64.deb" build/development-ci/deb-root
          build/development-ci/deb-root/usr/bin/mps version | grep -F "mps ${display} (commit ${commit},"
          tar -xzf "build/development-ci/mps_${version}_linux_amd64.tar.gz" -C build/development-ci
          "build/development-ci/mps_${version}_linux_amd64/mps" version | grep -F "mps ${display} (commit ${commit},"
          test -f build/development-ci/deb-root/usr/share/doc/mps/doc/DEPLOYMENT_TASKS.md
          test -f "build/development-ci/mps_${version}_linux_amd64/doc/DEPLOYMENT_TASKS.md"
          unzip -Z1 "build/development-ci/mps_${version}_windows_amd64.zip" | grep -Fx "mps_${version}_windows_amd64/doc/DEPLOYMENT_TASKS.md"
          for invalid in '0.0.0-dev+bad/path' '0.0.0-dev+bad value'; do
            if ./packaging/debian/build-deb.sh "$invalid" amd64 build/development-ci/deb-root/usr/bin/mps build/development-ci/deb-root/usr/bin/mpsd build/invalid-version >build/invalid-version.log 2>&1; then
              exit 1
            fi
            grep -Fq 'Invalid Debian package version:' build/invalid-version.log
          done
          if [[ "$version" == *-dev* ]]; then
            final="${version%%-dev*}"
            dpkg --compare-versions "${version/-dev/~dev}" lt "$final"
          fi
          mkdir -p build/override-rejected
          touch build/override-rejected/sentinel
          if MPS_BUILD_ID=012345 ./packaging/build-release.sh build/override-rejected >build/override-rejected.log 2>&1; then
            exit 1
          fi
          test -f build/override-rejected/sentinel
          grep -Fq 'requires the legacy VERSION OUTPUT_DIR form' build/override-rejected.log
      - uses: actions/upload-artifact@v7
        with:
          name: station-packages
          if-no-files-found: error
          path: |
            build/development-ci/mps_*_linux_amd64.tar.gz
            build/development-ci/mps_*_linux_arm64.tar.gz
            build/development-ci/mps_*_amd64.deb
            build/development-ci/mps_*_arm64.deb
            build/development-ci/mps_*_windows_amd64.zip

  terminal:
    name: Verify embedded terminal assets and browser behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/hterm/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/hterm
      - run: npm run check
        working-directory: tools/hterm
      - run: npx playwright install --with-deps chromium
        working-directory: tools/hterm
      - run: go build -o /tmp/mpsd-browser ./cmd/mpsd
      - run: npm test
        working-directory: tools/hterm
        env:
          STATION_BINARY: /tmp/mpsd-browser
