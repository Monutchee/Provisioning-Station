name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/mnc-station

  quality:
    name: Format, race, and cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Race detector
        run: go test -race ./...
      - name: Compile Linux arm64
        run: go build -trimpath -o /tmp/mnc-station-linux-arm64 ./cmd/mnc-station
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
      - name: Compile Windows amd64
        run: go build -trimpath -o /tmp/mnc-station-windows-amd64.exe ./cmd/mnc-station
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
