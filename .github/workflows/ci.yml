name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/mnc-station
      - name: Verify Windows MSI packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\input | Out-Null
          Copy-Item -Path mnc-station.exe, LICENSE, THIRD_PARTY_NOTICES.md -Destination release\input\
          dotnet tool install --global wix --version 6.0.0
          wix build -arch x64 -d Version=0.0.0 -d SourceDir="$pwd\release\input" -o release\mnc-station-ci.msi packaging\windows\Product.wxs

  quality:
    name: Format, race, and cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Race detector
        run: go test -race ./...
      - name: Compile Linux arm64
        run: go build -trimpath -o /tmp/mnc-station-linux-arm64 ./cmd/mnc-station
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
      - name: Compile Windows amd64
        run: go build -trimpath -o /tmp/mnc-station-windows-amd64.exe ./cmd/mnc-station
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
      - name: Verify release packaging and cleanup
        env:
          MNC_STATION_BUILD_ID: "012345"
        run: |
          bash -n packaging/bash-completion/mnc-station
          mkdir -p build/release-ci
          touch build/release-ci/stale-output
          ./packaging/build-release.sh 0.0.0 build/release-ci
          test ! -e build/release-ci/stale-output
          test -f build/release-ci/mnc-station_0.0.0+012345_linux_amd64.tar.gz
          test -f build/release-ci/mnc-station_0.0.0+012345_linux_arm64.tar.gz
          test -f build/release-ci/mnc-station_0.0.0+012345_windows_amd64.zip
          test -f build/release-ci/mnc-station_0.0.0+012345_amd64.deb
          dpkg-deb -x build/release-ci/mnc-station_0.0.0+012345_amd64.deb build/release-ci/deb-root
          grep -Fq 'ExecStart=/usr/bin/mnc-station serve --tftp-listen=:69 --data-dir=/var/lib/mnc-station' build/release-ci/deb-root/lib/systemd/system/mnc-station.service
          test -f build/release-ci/deb-root/usr/share/bash-completion/completions/mnc-station
          bash -n build/release-ci/deb-root/usr/share/bash-completion/completions/mnc-station
